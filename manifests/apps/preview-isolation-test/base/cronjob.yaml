apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-isolation-test
  namespace: preview-isolation-test
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: isolation-test
              image: busybox:latest
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/run-isolation-test.sh
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: isolation-test-script
                defaultMode: 0755
