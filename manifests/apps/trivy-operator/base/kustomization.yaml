apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  - vmscrape.yaml

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts/
    releaseName: trivy-operator
    namespace: trivy-operator
    version: 0.38.1
    includeCRDs: true
    valuesInline:
      operator:
        replicas: 1
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
        scanJobsConcurrentLimit: 1
        vulnerabilityScannerScanOnlyCurrentRevisions: true
        exposedSecretScannerEnabled: false
        infraAssessmentScannerEnabled: false
        clusterComplianceEnabled: false
        accessGlobalSecretsAndServiceAccount: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      trivy:
        offlineScan: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

configMapGenerator:
  # このダッシュボードは nuage-monitoring-stack の recording rule に依存する。
  # 定義場所は nuage-monitoring-stack の k8s/base/victoria/rules.yaml にある VMRule trivy-summary-rules である。
  #   - nuage:trivy_image_vulnerabilities:dedup_by_image (脆弱性をイメージの digest 単位で重複を除いた件数)
  #   - nuage:trivy_resource_configaudits:dedup_by_workload (設定不備を workload 単位にまとめた件数)
  # ルール名や数え方を変えるときは、このダッシュボードのクエリもあわせて直す。
  - name: trivy-operator-dashboard
    files:
      - dashboards/trivy-operator.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
