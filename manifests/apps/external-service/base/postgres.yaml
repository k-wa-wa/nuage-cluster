apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-slice
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
- port: 5432
  protocol: TCP
endpoints:
# PostgreSQL / Patroni クラスタの実ノード 3 台。
# Service (postgres.external-service) 経由のトラフィックは 3 台へラウンドロビン転送されるため読み取り・疎通確認用として機能する。
# プライマリへの書き込みを行うクライアントは、実ノード IP を直接指定したマルチホスト DSN (target_session_attrs=read-write) によりプライマリを自律検出する
- addresses:
  - 10.20.1.41
  - 10.20.1.42
  - 10.20.1.43
  conditions: {}
