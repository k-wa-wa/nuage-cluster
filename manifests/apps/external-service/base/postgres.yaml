apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-slice
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
- port: 5432
  protocol: TCP
endpoints:
# PostgreSQL / Patroni クラスタの実ノード 3 台。
# Headless Service (clusterIP: None) により名前解決時に実ノード 3 台の A レコードを直接返し、
# クライアント (libpq / pgx) が target_session_attrs=read-write 指定時にマルチホストとして認識し Primary 検出・フェイルオーバーを行う。
- addresses:
  - 10.20.1.41
  - 10.20.1.42
  - 10.20.1.43
  conditions: {}
