apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  clusterIP: None
  ports:
  - name: api
    protocol: TCP
    port: 9000
    targetPort: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: minio-slice
  labels:
    kubernetes.io/service-name: minio
addressType: IPv4
ports:
- name: api
  port: 9000
  protocol: TCP
endpoints:
# SeaweedFS (swfs S3) クラスタの実ノード 3 台。
# Headless Service (clusterIP: None) により名前解決時に 3 台の A レコードを直接返す。
- addresses:
  - 10.20.1.61
  - 10.20.1.62
  - 10.20.1.63
  conditions: {}
