apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: keel
    repo: https://charts.keel.sh
    releaseName: keel
    namespace: keel
    version: 1.2.3
    valuesInline:
      image:
        # 上流が Docker Hub から GitHub Container Registry に移行したため ghcr.io を参照する
        repository: ghcr.io/keel-hq/keel
        tag: 0.22.4
      helmProvider:
        # Argo CD 管理環境であり Helm release Secret の走査は不要なため無効化する
        enabled: false
      extraEnv:
        - name: WEBHOOK_ENDPOINT
          value: "http://monitoring-pwa-backend.nuage-monitoring-stack.svc.cluster.local/webhook/keel"
      # debug: true
