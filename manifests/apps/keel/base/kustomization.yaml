apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: keel
    repo: https://charts.keel.sh
    releaseName: keel
    namespace: keel
    version: 1.2.3
    valuesInline:
      image:
        # 上流が Docker Hub から GitHub Container Registry に移行したため ghcr.io を参照する
        repository: ghcr.io/keel-hq/keel
        tag: 0.22.4
      helmProvider:
        # Argo CD 管理環境であり Helm release Secret の走査は不要なため無効化する
        enabled: false
      rbac:
        clusterRole:
          # 監視対象はすべて公開イメージであり imagePullSecrets や Helm provider の Secret は不要なため、上流デフォルトから secrets 権限を除外する
          # チャート 1.2.3 の上流デフォルトから secrets ルールだけを除いた写しであり、チャート更新時は上流 values.yaml の rbac.clusterRole.rules と突き合わせる
          rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
                - nodes
              verbs:
                - get
                - watch
                - list
            - apiGroups:
                - ""
                - extensions
                - apps
                - batch
              resources:
                - pods
                - replicasets
                - replicationcontrollers
                - statefulsets
                - deployments
                - daemonsets
                - jobs
                - cronjobs
              verbs:
                - get
                - delete
                - watch
                - list
                - update
            - apiGroups:
                - ""
              resources:
                - configmaps
                - pods/portforward
              verbs:
                - get
                - create
                - update
      extraEnv:
        - name: WEBHOOK_ENDPOINT
          value: "http://monitoring-pwa-backend.nuage-monitoring-stack.svc.cluster.local/webhook/keel"
      # debug: true
