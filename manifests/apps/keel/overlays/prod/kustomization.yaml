apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keel

resources:
- ../../base

patches:
  # 旧世代 Helm チャート（helm.sh/chart ラベル無し）かつ単一ポーリングコントローラ前提のため、prod HA ポリシーを除外する
  - target:
      kind: Deployment
      name: keel
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keel
        annotations:
          nuage.io/ignore-ha: "true"
