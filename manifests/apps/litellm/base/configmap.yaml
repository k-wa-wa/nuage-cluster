apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      # 1. lm-server のみ利用
      - model_name: lm-server/auto
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://lm-server.external-service.svc.cluster.local:8080/v1
          api_key: "dummy"
          request_timeout: 600

      # 2. sakura のみ利用 (さくらのAI Platform)
      - model_name: sakura/auto
        litellm_params:
          model: openai/preview/Kimi-K2.6
          api_base: https://api.ai.sakura.ad.jp/v1
          api_key: os.environ/SAKURA_API_KEY
          request_timeout: 120

      # 3. 自動フォールバック (auto: 通常は lm-server、ダウン時は sakura へ)
      - model_name: auto
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://lm-server.external-service.svc.cluster.local:8080/v1
          api_key: "dummy"
          request_timeout: 600

      # 4. gemini のみ利用 (Google AI Studio)
      - model_name: gemini/auto
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY
          request_timeout: 120

    router_settings:
      routing_strategy: simple-shuffle
      # 電源断による接続拒否時に無駄な再試行をせず即座に sakura へフォールバックするため 0 に設定する
      num_retries: 0
      timeout: 600
      fallbacks:
        - auto: ["sakura/auto"]

    litellm_settings:
      telemetry: false
      request_timeout: 600

    # TODO: 運用は要検討
    general_settings:
      dangerously_permit_weak_or_unset_master_key: true
