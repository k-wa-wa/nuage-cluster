apiVersion: v1
kind: ConfigMap
metadata:
  name: gemini-live-proxy-config
data:
  default.conf.template: |
    # Gemini Live WebSocket パススループロキシ設定
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            # Google AI Studio の WebSocket API へリバースプロキシ
            proxy_pass https://generativelanguage.googleapis.com;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host generativelanguage.googleapis.com;
            # クラスター内 Secret から注入された API キーをヘッダーに自動付与
            proxy_set_header x-goog-api-key "${GEMINI_API_KEY}";
            proxy_ssl_server_name on;
            # 双方向長時間音声ストリーミング用タイムアウト
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
