apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-live-proxy
  labels:
    app: gemini-live-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemini-live-proxy
  template:
    metadata:
      labels:
        app: gemini-live-proxy
    spec:
      containers:
      - name: proxy
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: GEMINI_API_KEY
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/nginx/templates/default.conf.template
          subPath: default.conf.template
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: proxy-config
        configMap:
          name: gemini-live-proxy-config
