apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spire-server
  namespace: spire
  annotations:
    ingress.cilium.io/tls-passthrough: "enabled"
spec:
  ingressClassName: cilium
  rules:
    - host: spire.wpcapp.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spire-server
                port:
                  number: 443
