apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: spire-crds
    repo: https://spiffe.github.io/helm-charts-hardened
    releaseName: spire-crds
    namespace: spire
    version: 0.6.1
    valuesInline:
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-wave: "-1"
  - name: spire
    repo: https://spiffe.github.io/helm-charts-hardened
    releaseName: spire
    namespace: spire
    version: 0.31.0
    valuesFile: values.yaml

configMapGenerator:
  - name: spire-ssh-ca
    namespace: spire
    files:
      - ssh-ca.pub

resources:
  - namespace.yaml
  - ingress.yaml
  - cluster-spiffe-id-preview-echo-bot.yaml
  - cluster-static-entry-atelier-bot.yaml
