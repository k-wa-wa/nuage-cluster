# app of apps のルート Application。manifests/apps/ 直下 (非再帰) を automated sync することで、
# appset-prod.yaml・multi-repo-deploy.yaml・各 preview ApplicationSet 等の ApplicationSet 定義自体を
# Argo CD 管理下に置く。このファイル自身も manifests/apps/ 直下にあるため自己を含めて selfHeal される。
#
# manifests/apps/<app>/overlays/prod のような個別アプリのマニフェストは appset-prod.yaml 側の
# directories generator が別途検出するため、ここでは対象にならない (recurse: false のため下位ディレクトリは無視)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/k-wa-wa/nuage-cluster
    targetRevision: HEAD
    path: manifests/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
