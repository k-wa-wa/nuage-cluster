defaults
    mode    tcp
    option  tcpka
    timeout connect 10s
    timeout client  24h
    timeout server  24h


# ==========================================================
# llama.cpp (llama-server) Proxy (8080)
# ==========================================================
frontend llama-cpp-in
    bind *:8080
    default_backend llama-cpp-out

backend llama-cpp-out
    server lm-server 192.168.5.222:8080 check inter 10s fall 3 rise 2

frontend stats
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

