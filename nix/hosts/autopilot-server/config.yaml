allowed_actors:
  - k-wa-wa

repos:
  # - owner: k-wa-wa
  #   name: nuage-autopilot3
  - owner: k-wa-wa
    name: pechka
  - owner: k-wa-wa
    name: nuage-cluster
  # - owner: k-wa-wa
  #   name: nuage-monitoring-stack
  # - owner: k-wa-wa
  #   name: bare-web-proxy
  # - owner: k-wa-wa
  #   name: nuage-workspace

workspace: /var/lib/autopilot/workspaces
database: /var/lib/autopilot/autopilot.db
log_dir: /var/lib/autopilot/logs

dashboard:
  host: 0.0.0.0
  port: 8787

poll:
  interval_sec: 60
  review_interval_sec: 120
  since_rewind_sec: 30

ci:
  grace_period_sec: 180
  wait_limit_sec: 1800
  max_retry: 5

agent:
  refine_timeout_sec: 900
  implement_timeout_sec: 3600
  evaluate_timeout_sec: 1800
  lease_margin_sec: 300

agents:
  refine:
    command: claude
    # model: opus
  implement:
    command: claude
    # model: opus
  evaluate:
    command: claude
    # model: opus

queue:
  max_concurrent: 2
