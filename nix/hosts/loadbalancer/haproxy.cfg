defaults
    mode    tcp

frontend k8s-nodeport-in
    bind *:80
    bind *:443
    use_backend k8s-http if { dst_port 80 }
    use_backend k8s-https if { dst_port 443 }

backend k8s-http
    balance roundrobin
    server node01 10.20.1.16:30080 check
    server node02 10.20.1.17:30080 check
    server node03 10.20.1.18:30080 check

backend k8s-https
    balance roundrobin
    server node01 10.20.1.16:30443 check
    server node02 10.20.1.17:30443 check
    server node03 10.20.1.18:30443 check

# ==========================================================
# Kubernetes API (6443)
# ==========================================================
frontend k8s-api-in
    bind *:6443
    acl allowed_src src 192.168.5.0/24
    tcp-request connection reject if ! allowed_src
    default_backend k8s-api

backend k8s-api
    balance roundrobin
    server node01 10.20.1.11:6443 check
    server node02 10.20.1.12:6443 check
    server node03 10.20.1.13:6443 check

frontend talos-api-in
    bind *:50000
    acl allowed_src src 192.168.5.0/24
    tcp-request connection reject if ! allowed_src
    default_backend talos-api

backend talos-api
    balance roundrobin
    server node01 10.20.1.11:50000 check

# Victoria スタック (nuage-monitoring-stack) の vmauth。クラスタ外のホストからのログ投入
# (journald / OpenTelemetry) と参照の入口にする。削除系 API は vmauth 側で通さない
frontend victoria-in
    bind *:8427
    acl allowed_src src 10.20.1.0/24 192.168.5.0/24
    tcp-request connection reject if ! allowed_src
    default_backend victoria

backend victoria
    balance roundrobin
    server node01 10.20.1.16:30427 check
    server node02 10.20.1.17:30427 check
    server node03 10.20.1.18:30427 check

# メインフレーム (MVS/CE) の TN3270。LAN の 3270 端末エミュレータから TSO にログオンする入口にする。
# TN3270 は平文のため LAN 内に限る。ヘルスチェックの接続ごとに Hercules が端末を割り当てて
# コンソールにログが出るため、check は付けない (server が 1 台なので振り分けも不要)
frontend tn3270-in
    bind *:3270
    acl allowed_src src 192.168.5.0/24
    tcp-request connection reject if ! allowed_src
    default_backend mainframe-tn3270

backend mainframe-tn3270
    server mainframe 10.20.1.90:3270

frontend stats
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

