# autopilot5 が作業ごとに使うモデルの並び。モデルを更新するときはこのファイルだけを書き換える。
#
# roles は担当 CLI の優先順。各 CLI 内は賢さの段階 → 前から順に試すモデル。
#   impl:   実装・修正・要約の担当。先頭から試し、使えなければ次の CLI へ切り替える。
#   review: レビューに使える担当の並び。レビューは自由・網羅の 2 観点を並列に走らせ、
#           観点 i は並びの i 番目から始め、使えなければ残りを並びの順に試す。
#           今の並びでは自由が claude → codex → agy、網羅が codex → claude → agy の順になる。
#           どちらかの CLI が使えなければ、残った方が別の会話で両方の観点を見る。
#           並びに書かない CLI はレビューに使わない。
#
#   high:    実装・修正 (既定) とレビュー
#   standard: 窓口が --level standard を付けた実装・修正 (小さく機械的な仕事)
#   light:    要約
# 書き方は "MODEL" か "MODEL@EFFORT"。agy はモデル名に effort が入っているので MODEL だけでよい。
#
# 認証切れ・利用上限・会話切れで失敗し、作業ツリーが変わっていなければ次の候補へ切り替える。
# 実装に成功した CLI とモデルは修正でも維持し、再開に失敗したら停止する。
# 下の段階へは自動で落とさない。許すならその段階の並びに書く。
#
# 反映: push 後の自動更新 (毎日)。急ぐときは atelier で `sudo systemctl start nixos-upgrade` を実行する。
# 確認: atelier で `autopilot-run models` を実行する。書き間違いはビルドで落ちる。
# 使えるモデル: `agy models`、claude / codex のモデル選択で確認する。

roles:
  impl: [agy, codex, claude]
  review: [claude, codex, agy]

claude:
  high: [claude-opus-5-5@high]
  standard: [claude-sonnet-5-5@medium]
  light: [claude-haiku-5-5@low]

# Gemini 4 Argon は利用枠が小さいため採用しない。
# GPT-OSS 120B は使用しない。
agy:
  high: [gemini-3.8-flash-high]
  standard: [gemini-3.8-flash-medium]
  light: [gemini-3.8-flash-low]

# Claude の各段階に役割を揃える（性能が同等であることは保証しない）。
codex:
  high: [gpt-6-astra@high]
  standard: [gpt-6.1-sol@medium]
  light: [gpt-6-luna@low]
