# --- Anthropic Claude ---
# 出典: https://platform.claude.com/docs/en/about-claude/pricing
claude-opus-5-5:
  input: 4.00
  output: 20.00
  cache_read: 0.20
  cache_creation: 5.00  # 5m キャッシュ作成単価

