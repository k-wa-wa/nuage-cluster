name: Nix Check

on:
  pull_request:
    paths:
      - "nix/**"
      - "tests/**"
      - ".github/workflows/nix-check.yaml"

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Check Flake Evaluation
        run: nix flake check ./nix

      - name: Test Upgrade Healthcheck
        run: python3 -B -m unittest tests.test_upgrade_healthcheck
