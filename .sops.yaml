creation_rules:
  - path_regex: terraform/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
  - path_regex: terraform/truenas/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key

  - path_regex: terraform/cloudflare/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key

  # ホストごとの SSH ホスト鍵 (scripts/gen-host-keys.sh が書く)。ホスト自身には開かせない。
  - path_regex: terraform/pve/hosts-secrets/host-keys\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key

  # ログイン用の SSH 鍵 (scripts/gen-login-key.sh が書く)。人間だけが開ける。
  - path_regex: \.ssh/login-keys\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key

  - path_regex: scripts/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *argocd_key

  - path_regex: nix/hosts/loadbalancer/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *lb_1
          - *lb_2
          - *lb_3

  - path_regex: nix/hosts/postgres-cluster/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *pg_cluster_1
          - *pg_cluster_2
          - *pg_cluster_3


  - path_regex: nix/hosts/swfs-cluster/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *swfs_cluster_1
          - *swfs_cluster_2
          - *swfs_cluster_3

  - path_regex: nix/hosts/mainframe/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *mainframe

  - path_regex: nix/hosts/bluray-extractor/secrets.yaml
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *bluray_extractor

  # atelier の agent ユーザーが各ホストへ入る鍵 (scripts/gen-atelier-agent-key.sh が書く)。
  - path_regex: nix/hosts/atelier/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *atelier

  - path_regex: manifests/apps/cert-manager/overlays/prod/secrets.yaml
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *argocd_key

  - path_regex: manifests/apps/litellm/overlays/prod/secrets\.yaml$
    key_groups:
      - age:
          - *admin_key
          - *master_key
          - *argocd_key
