all:
  vars:
    # 鍵は .ssh/login-keys.yaml の omada (scripts/gen-login-key.sh が作り、.ssh/keys/omada に置く)。
    # TODO: Omada コントローラーを NixOS に移したら nix/modules/bootstrap.nix の nixos 鍵に寄せ、omada 鍵は消す。
    ansible_ssh_private_key_file: ./.ssh/keys/omada
  children:
    omada-controllers:
      hosts:
        oc1-omada-controller:
          ansible_host: 192.168.5.163
          ansible_user: ubuntu
